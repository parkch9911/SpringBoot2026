<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/headercss.css}">
<script th:src="@{/js/member.js}"></script>
</head>
<body>
<header th:replace="~{/header/header.html::header}"></header>
<section>
		<div id="section_wrap">
			<div class="word">
				<h2>회원 가입 결과</h2>
			</div>
			<div class="content">
				<div th:if="${result>0}" align="center">
					회원가입이 완료되었습니다.
				</div>
				<div th:if="${result<=0}" align="center">
					회원가입 실패!
				</div>
			<a th:href="@{/}">홈으로 이동</a>
			<a th:href="@{/member/login}">로그인페이지로 이동</a>
			</div>
		</div>
	</section>
</body>
</html>

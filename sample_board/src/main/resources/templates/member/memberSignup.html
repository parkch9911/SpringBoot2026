<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
		<div id="section_wrap">
			<div class="word"><h2>회원가입</h2></div>
			<div class="content">
			  <form th:action="@{/signupresult}"
			  name="signup_form" method="POST">
			   <table width="500" border="1">
			     <tbody>
			     	<tr height="50">
			     	    <td width="150" align="center">아이디</td>
			     		<td width="350" align="center">
			     			<input type="text" name="id" class="content"
			     			 placeholder="아이디를 입력하세요">
			     		</td>
			     	</tr>
			     	<tr height="50">
			     	    <td width="150" align="center">비밀번호</td>
			     		<td width="350" align="center">
			     			<input type="password" name="pw" class="content"
			     			 placeholder="비밀번호를 입력하세요">
			     		</td>
			     	</tr>
			     	<tr height="50">
			     	    <td width="150" align="center">이름</td>
			     		<td width="350" align="center">
			     			<input type="text" name="name" class="content"
			     			 placeholder="이름을 입력하세요">
			     		</td>
			     	</tr>
			     	<tr height="50">
			     		<td colspan="2" align="center">
			     			<input type="button" value="회원가입">
			     			 <input type="reset" value="취소">
			     		</td>
			     	</tr>
			     </tbody>
			   </table>
			  </form>
			  
			</div>
		</div>
</body>
</html>

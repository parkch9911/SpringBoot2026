<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" th:href="@{/css/headercss.css}">
<script th:src="@{/js/member.js}"></script>
</head>

<style>
/* 전체 페이지 기본 설정 */
body {
    margin: 0;
    padding: 0;
    font-family: "Noto Sans KR", sans-serif;
    background-color: #f5f6f7;
}

/* 전체 감싸는 영역 */
#section_wrap {
    width: 100%;
    display: flex;
    justify-content: center;
    margin-top: 80px;
}

/* 제목 영역 */
.word h2 {
    text-align: center;
    margin-bottom: 30px;
    color: #333;
}

/* 폼 컨텐츠 영역 */
.content {
    display: flex;
    justify-content: center;
}

/* 테이블 스타일 */
table {
    border-collapse: collapse;
    background-color: #fff;
    border: 1px solid #ddd;
}

/* 테이블 셀 */
td {
    border: 1px solid #ddd;
    font-size: 14px;
    color: #333;
}

/* 입력창 */
input[type="text"],
input[type="password"] {
    width: 90%;
    height: 35px;
    padding: 5px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
}

/* 입력창 포커스 */
input[type="text"]:focus,
input[type="password"]:focus {
    outline: none;
    border-color: #4a90e2;
}

/* 버튼 공통 */
input[type="button"],
input[type="reset"] {
    width: 120px;
    height: 40px;
    border: none;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    margin: 0 10px;
}

/* 회원가입 버튼 */
input[type="button"] {
    background-color: #4a90e2;
    color: #fff;
}

input[type="button"]:hover {
    background-color: #357abd;
}

/* 취소 버튼 */
input[type="reset"] {
    background-color: #ccc;
    color: #333;
}

input[type="reset"]:hover {
    background-color: #b3b3b3;
}

</style>
<body>
<header th:replace="~{/header/header.html::header}"></header>
		<div id="section_wrap">
			<div class="word"><h2>회원가입</h2></div>
			<div class="content">
			  <form th:action="@{/member/signupresult}"
			  name="signup_form" method="POST">
			   <table width="500" border="1">
			     <tbody>
			     	<tr height="50">
			     	    <td width="150" align="center">아이디</td>
			     		<td width="350" align="center">
			     			<input type="text" name="id" class="content"
			     			 placeholder="아이디를 입력하세요">
			     		</td>
			     	</tr>
			     	<tr height="50">
			     	    <td width="150" align="center">비밀번호</td>
			     		<td width="350" align="center">
			     			<input type="password" name="pw" class="content"
			     			 placeholder="비밀번호를 입력하세요">
			     		</td>
			     	</tr>
			     	<tr height="50">
			     	    <td width="150" align="center">이름</td>
			     		<td width="350" align="center">
			     			<input type="text" name="name" class="content"
			     			 placeholder="이름을 입력하세요">
			     		</td>
			     	</tr>
			     	<tr height="50">
			     		<td colspan="2" align="center">
			     			<input type="button" value="회원가입"
			     			 onclick="signupForm();">
			     			 <input type="reset" value="취소">
			     		</td>
			     	</tr>
			     </tbody>
			   </table>
			  </form>
			  
			</div>
		</div>
</body>
</html>
